name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://pgp.lbenicio.dev/
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --account-id "$CLOUDFLARE_ACCOUNT_ID"
      - name: Summary
        if: always()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## 🚀 Deploy to Cloudflare Workers"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            printf '| Branch | %s |\n' "$BRANCH_NAME"
            printf '| Commit | %s |\n' "$COMMIT_SHA"
            printf '| Status | %s |\n' "$JOB_STATUS"
            echo "| Live URL | https://pgp.lbenicio.dev |"
          } >> "$GITHUB_STEP_SUMMARY"
